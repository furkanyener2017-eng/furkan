
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash Oyun Dünyası</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#dce8f5;
  font-family:Verdana,Arial,sans-serif;
  color:#222;
}
header {
  background:linear-gradient(#268bd5,#07549a);
  color:white;
  text-align:center;
  padding:25px 10px;
  border-bottom:5px solid #ff9900;
}
header h1 { font-size:34px; margin:5px; }
nav {
  background:#123e70;
  text-align:center;
  padding:12px;
}
nav a {
  color:white;
  margin:12px;
  text-decoration:none;
  font-weight:bold;
}
.container {
  max-width:1050px;
  margin:20px auto;
  padding:15px;
}
.panel {
  background:white;
  border:1px solid #9bb8d5;
  padding:15px;
  margin-bottom:18px;
  box-shadow:2px 2px 5px #aaa;
}
.games {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:15px;
}
.game {
  background:#edf5ff;
  border:2px solid #aac6e3;
  text-align:center;
  padding:12px;
  cursor:pointer;
}
.game:hover {
  border-color:#ff9900;
  background:#fff4d9;
}
.cover {
  height:95px;
  background:linear-gradient(135deg,#268bd5,#123e70);
  color:white;
  display:grid;
  place-items:center;
  font-size:35px;
}
button {
  background:#0875bd;
  color:white;
  border:0;
  padding:10px 20px;
  cursor:pointer;
}
#player {
  display:none;
  text-align:center;
}
#gameFrame {
  width:100%;
  height:550px;
  background:#111;
}
#gameFrame object {
  width:100%;
  height:100%;
}
footer {
  text-align:center;
  padding:25px;
  background:#123e70;
  color:white;
}
</style>
</head>
<body>

<header>
<h1>🎮 FLASH OYUN DÜNYASI</h1>
<p>En güzel eski Flash oyunları burada!</p>
</header>

<nav>
<a href="#">Ana Sayfa</a>
<a href="#oyunlar">Oyunlar</a>
</nav>

<div class="container">
<div class="panel">
<h2>⭐ Hoş Geldin!</h2>
<p>Eski internet oyunlarının keyfini çıkar!</p>
</div>

<div id="player" class="panel">
<h2 id="gameTitle">Oyun</h2>
<div id="gameFrame"></div>
<br>
<button onclick="closeGame()">← Oyunlara Dön</button>
</div>

<div class="panel" id="oyunlar">
<h2>🕹️ Oyun Arşivi</h2>
<div class="games" id="games"></div>
</div>
</div>

<footer>
Flash Oyun Dünyası © 2026
</footer>

<script>
const oyunlar = [
  {ad:"Oyun 1",dosya:"oyun1.swf",ikon:"🎯"},
  {ad:"Oyun 2",dosya:"oyun2.swf",ikon:"🚗"},
  {ad:"Oyun 3",dosya:"oyun3.swf",ikon:"⚽"},
  {ad:"Oyun 4",dosya:"oyun4.swf",ikon:"🧩"}
];

const liste = document.getElementById("games");

oyunlar.forEach((oyun) => {
  const kart = document.createElement("div");
  kart.className = "game";
  kart.innerHTML = `
    <div class="cover">${oyun.ikon}</div>
    <h3>${oyun.ad}</h3>
    <button>OYNA</button>
  `;
  kart.onclick = () => openGame(oyun);
  liste.appendChild(kart);
});

function openGame(oyun) {
  document.getElementById("player").style.display="block";
  document.getElementById("gameTitle").textContent=oyun.ad;
  document.getElementById("gameFrame").innerHTML="";
  const obj=document.createElement("object");
  obj.setAttribute("data","games/"+oyun.dosya);
  obj.setAttribute("type","application/x-shockwave-flash");
  document.getElementById("gameFrame").appendChild(obj);
  document.getElementById("player").scrollIntoView();
}

function closeGame() {
  document.getElementById("gameFrame").innerHTML="";
  document.getElementById("player").style.display="none";
}
</script>
</body>
</html>
